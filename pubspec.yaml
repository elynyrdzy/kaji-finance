name: kaji_finance
description: Kaji Finance - personal financial tracking app.
publish_to: 'none'
version: 1.3.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.1.2
  local_auth: ^2.1.7
  path_provider: ^2.1.2
  share_plus: ^13.0.0
  file_picker: ^12.0.0
  crypto: ^3.0.3
  cryptography: ^2.9.0
  timezone: ^0.9.4
  permission_handler: ^13.0.2
  package_info_plus: ^10.2.1
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
